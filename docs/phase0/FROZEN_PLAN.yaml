    Sensitivity = causal + STRING physical edges as unsigned auxiliary connectivity
    to probe coverage of sparse pharmacology targets without silently replacing the
    primary substrate. Frozen before any drug-target coverage inspection (Phase 3.5
    A4).
  phase5_min_drug_targets_in_substrate: 1
  phase5_poor_coverage_policy: report_structural_limitation_do_not_switch_substrate
  feature_min_variance: 1.0e-08
